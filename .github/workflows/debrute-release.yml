name: Debrute Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  preflight:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: nextest@0.9.140
          fallback: none
      - name: Install architecture scanner dependency
        run: brew install ripgrep
      - run: pnpm install --frozen-lockfile
      - name: Prepare pinned native raster payload
        run: pnpm native:raster:prepare
      - name: Validate tag version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - run: node scripts/validate-release-version-contract.mjs
      - run: pnpm doctor
      - run: pnpm check
      - run: pnpm check:rust:all
      - run: pnpm test
      - run: pnpm lint:arch

  build-product:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            publicPlatform: macos
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            publicPlatform: macos
            arch: x64
          - os: windows-latest
            platform: win32
            publicPlatform: windows
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned cargo-nextest
        if: matrix.platform == 'win32'
        uses: taiki-e/install-action@v2.85.11
        with:
          tool: nextest@0.9.140
          fallback: none
      - run: pnpm install --frozen-lockfile
      - name: Prepare pinned native raster payload
        run: pnpm native:raster:prepare
      - name: Check exhaustive Windows Rust targets
        if: matrix.platform == 'win32'
        run: pnpm check:rust:all
      - name: Verify native Project watcher
        run: pnpm test:rust:native-watcher
      - name: Test Windows Rust product commit primitives
        if: matrix.platform == 'win32'
        run: pnpm test:rust
      - name: Verify Windows Workbench in a real browser
        if: matrix.platform == 'win32'
        run: pnpm verify:browser
      - run: pnpm build
      - name: Prepare Apple signing and notarization credentials
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in CSC_LINK_SECRET CSC_KEY_PASSWORD_SECRET APPLE_API_KEY_SECRET APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required macOS signing secret: ${name%_SECRET}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_SECRET" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"

          P12_PATH="$RUNNER_TEMP/developer-id-application.p12"
          DEVELOPER_ID_G2_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          printf '%s' "$CSC_LINK_SECRET" | base64 --decode > "$P12_PATH"
          chmod 600 "$P12_PATH"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$DEVELOPER_ID_G2_PATH"

          SIGNING_KEYCHAIN="$RUNNER_TEMP/debrute-signing.keychain-db"
          SIGNING_KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$DEVELOPER_ID_G2_PATH" -k "$SIGNING_KEYCHAIN"
          security import "$P12_PATH" \
            -k "$SIGNING_KEYCHAIN" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -P "$CSC_KEY_PASSWORD_SECRET"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$SIGNING_KEYCHAIN_PASSWORD" \
            "$SIGNING_KEYCHAIN"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" $EXISTING_KEYCHAINS
          security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | grep 'Developer ID Application: Hongrui Wu (FR25929R7Z)'
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY_PATH"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "CSC_NAME=Hongrui Wu (FR25929R7Z)"
          } >> "$GITHUB_ENV"
      - name: Sign macOS Product binaries and rebuild the strict seed
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          for binary in target/release/debrute-runtime target/release/debrute target/release/native-raster/*.dylib; do
            codesign --force --options runtime --timestamp --sign "$CSC_NAME" "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          done
          node scripts/assemble-product-seed.mjs
          RUNTIME_APP="apps/desktop/dist-electron/product-seed/runtime/Debrute Runtime.app"
          codesign --force --options runtime --timestamp --sign "$CSC_NAME" "$RUNTIME_APP"
          codesign --verify --deep --strict --verbose=2 "$RUNTIME_APP"
          node scripts/refresh-product-seed-manifest.mjs
      - name: Archive Product seed
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/archive-product-seed.mjs --platform "${{ matrix.publicPlatform }}" --arch "${{ matrix.arch }}" --version "$VERSION"
      - name: Build signed macOS Product Installer
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          pnpm --filter @debrute/desktop exec electron-builder --mac dir --${{ matrix.arch }} --publish never
          DESKTOP_APP="$(find apps/desktop/release -path '*/Debrute.app' -type d -print -quit)"
          test -n "$DESKTOP_APP"
          node apps/desktop/scripts/build-macos-product-installer.mjs \
            --desktop-app "$DESKTOP_APP" \
            --version "$VERSION" \
            --arch "${{ matrix.arch }}" \
            --identity "$CSC_NAME" \
            --output-directory apps/desktop/release
      - name: Notarize macOS DMG
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          DMG_PATH="apps/desktop/release/debrute-installer-${VERSION}-macos-${{ matrix.arch }}.dmg"
          node scripts/notarize-macos-artifact.cjs \
            --path "$DMG_PATH" \
            --label "debrute-installer-${VERSION}-macos-${{ matrix.arch }}.dmg"
      - name: Build unsigned Windows Product Installer
        if: matrix.platform == 'win32'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @debrute/desktop exec electron-builder --win nsis --x64 --publish never
      - name: Verify Windows Product binaries are Authenticode-unsigned
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $paths = @(
            'target/release/debrute-runtime.exe',
            'target/release/debrute.exe',
            'apps/desktop/release/win-unpacked/Debrute.exe',
            'apps/desktop/release/win-unpacked/resources/product-seed/runtime/debrute-runtime.exe',
            'apps/desktop/release/win-unpacked/resources/product-seed/runtime/debrute.exe',
            "apps/desktop/release/debrute-installer-$version-windows-x64.exe"
          )
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Windows release binary: $path"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
              throw "Windows release binary must be Authenticode-unsigned: $path ($($signature.Status))"
            }
            Write-Host "NotSigned: $path"
          }
      - name: Smoke test packaged Desktop and Runtime
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "win32" ]; then
            VERSION="$(node -p "require('./package.json').version")"
            INSTALLER="apps/desktop/release/debrute-installer-${VERSION}-windows-x64.exe"
            node scripts/install-product-smoke.mjs --platform win32 --installer "$INSTALLER"
            DESKTOP="$LOCALAPPDATA\Programs\Debrute\Debrute.exe"
            DESKTOP_ROOT="$LOCALAPPDATA\Programs\Debrute"
            CLI="$USERPROFILE\.debrute\bin\debrute.cmd"
          else
            VERSION="$(node -p "require('./package.json').version")"
            INSTALLER="apps/desktop/release/debrute-installer-${VERSION}-macos-${{ matrix.arch }}.dmg"
            node scripts/install-product-smoke.mjs --platform darwin --installer "$INSTALLER"
            DESKTOP="$HOME/Applications/Debrute.app/Contents/MacOS/Debrute"
            DESKTOP_ROOT="$HOME/Applications/Debrute.app"
            CLI="$HOME/.debrute/bin/debrute"
          fi
          test -n "$DESKTOP"
          test -n "$CLI"
          node scripts/smoke-packaged-desktop.mjs \
            --desktop "$DESKTOP" \
            --cli "$CLI" \
            --platform "${{ matrix.platform }}"
          node scripts/smoke-product-removal.mjs \
            --platform "${{ matrix.platform }}" \
            --cli "$CLI" \
            --desktop "$DESKTOP" \
            --desktop-root "$DESKTOP_ROOT"
      - name: Verify Product Installer assets
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/product-installer-assets.mjs --release-dir apps/desktop/release --version "$VERSION" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
      - name: Verify macOS signing
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/verify-macos-desktop-signing.mjs --release-dir apps/desktop/release --version "$VERSION" --arch "${{ matrix.arch }}" --bundle-id io.github.xiitang.debrute
      - uses: actions/upload-artifact@v4
        with:
          name: debrute-installer-${{ matrix.publicPlatform }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/debrute-installer-*-${{ matrix.publicPlatform }}-${{ matrix.arch }}.dmg
            apps/desktop/release/debrute-installer-*-${{ matrix.publicPlatform }}-${{ matrix.arch }}.exe
            apps/desktop/release/debrute-product-*-${{ matrix.publicPlatform }}-${{ matrix.arch }}.zip

  publish-release:
    needs:
      - build-product
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten assets
        run: |
          set -euo pipefail
          mkdir -p release-upload
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "release-upload/$name" ]; then
              echo "::error::Duplicate release asset: $name"
              exit 1
            fi
            cp "$file" "release-upload/$name"
          done < <(find release-assets -type f -print0)
      - name: Generate signed update manifest
        env:
          DEBRUTE_UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.DEBRUTE_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/generate-update-manifest.mjs --release-dir release-upload --version "$VERSION"
          test -f release-upload/debrute-update-manifest.json
          test -f release-upload/debrute-update-manifest.json.sig
      - name: Verify expected assets
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node -e "import('./scripts/release-asset-contract.mjs').then(({expectedReleaseAssets}) => { const fs = require('fs'); const actual = fs.readdirSync('release-upload').sort(); const expected = expectedReleaseAssets(process.argv[1]).sort(); const missingAssets = expected.filter((name) => !actual.includes(name)); const unexpectedAssets = actual.filter((name) => !expected.includes(name)); if (missingAssets.length) { console.error('Missing release assets:', missingAssets.join(', ')); process.exit(1); } if (unexpectedAssets.length) { console.error('Unexpected release assets:', unexpectedAssets.join(', ')); process.exit(1); } })" "$VERSION"
      - name: Write release notes
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          cat > release-notes.md <<EOF
          # Debrute ${VERSION}

          Product Installer assets:
          - macOS: signed and notarized DMG installers for Apple Silicon and Intel Macs.
          - Windows: NSIS installer for x64. This release is not Authenticode-signed, so Windows may show an Unknown Publisher or SmartScreen warning.

          Runtime update payloads for macOS and Windows are complete Product seeds authenticated by the signed update manifest; they are consumed by Debrute Runtime and are not separate user installers.

          Install Debrute with the Product Installer for your platform. Installation completes Desktop, Runtime, the debrute CLI, command exposure, and official Skills before success; first Desktop launch performs no installation work.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release-upload/*
