[package]
name = "debrute-native-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
trash.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
dunce.workspace = true
windows.workspace = true
windows-sys.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
trash.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dev-dependencies]
uuid.workspace = true

# This crate is the single reviewed native safety capsule for filesystem
# operations that Rust's standard library does not expose atomically.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
